<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="chrome-wrap">
    <img class="chrome-img" src="assets/profile_chrome.png" alt="">
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="viewer" id="viewer">
  <div class="post-chrome-wrap">
    <img class="chrome-img" src="assets/post_chrome.png" alt="">
    <span class="viewer-back" id="closeViewer">‹</span>
  </div>

  <div class="media-wrap">
    <div class="carousel" id="carousel"></div>
    <div class="arrow left" id="prevBtn">‹</div>
    <div class="arrow right" id="nextBtn">›</div>
  </div>
  <div class="dots" id="dots"></div>

  <div class="post-actions">
    <img class="icon" src="assets/icon_heart.png" alt="">
    <span class="post-likes" id="postLikes"></span>
    <img class="icon" src="assets/icon_comment.png" alt="">
    <img class="icon" src="assets/icon_repost.png" alt="">
    <img class="icon" src="assets/icon_send.png" alt="">
    <img class="icon bookmark" src="assets/icon_bookmark.png" alt="">
  </div>

  <div class="post-caption" id="postCaption"></div>
</div>

<script src="manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
